name: Daily Course Sync

on:
  # Run at 4:00 AM UTC every weekday (Monday-Friday)
  schedule:
    - cron: '0 4 * * 1-5'

  # Allow manual trigger from GitHub Actions UI
  workflow_dispatch:

jobs:
  sync-courses:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Create .env.local
        run: |
          cat << EOF > .env.local
          NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          EOF

      - name: Sync all courses and calculate plan dates
        run: npx tsx scripts/sync-courses.ts --school-year "2026-27"
        timeout-minutes: 30

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Daily course sync failed at $(date)"
